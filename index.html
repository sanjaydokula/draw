<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Quick Draw Replica</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Hanken+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary-fixed": "#e2e2e2",
        "tertiary-fixed-dim": "#c6c6c7",
        "surface-bright": "#3a3939",
        "on-tertiary": "#2f3131",
        "on-tertiary-fixed-variant": "#454747",
        "surface-tint": "#c6c6c7",
        "tertiary-fixed": "#e2e2e2",
        "on-primary-fixed": "#1a1c1c",
        "on-error": "#690005",
        "surface-dim": "#131313",
        "tertiary": "#ffffff",
        "primary-fixed-dim": "#c6c6c7",
        "on-secondary-fixed": "#1b1c1c",
        "error-container": "#93000a",
        "surface-container-low": "#1c1b1b",
        "border-subtle": "#262626",
        "on-secondary": "#303030",
        "on-surface-variant": "#c4c7c8",
        "outline-variant": "#444748",
        "on-tertiary-container": "#636565",
        "primary": "#ffffff",
        "accent-highlight": "#F4F4F4",
        "on-primary": "#2f3131",
        "on-primary-container": "#636565",
        "on-error-container": "#ffdad6",
        "error": "#ffb4ab",
        "secondary": "#c8c6c5",
        "secondary-container": "#474746",
        "inverse-surface": "#e5e2e1",
        "on-secondary-fixed-variant": "#474746",
        "surface-container-high": "#2a2a2a",
        "secondary-fixed-dim": "#c8c6c5",
        "surface": "#131313",
        "tertiary-container": "#e2e2e2",
        "on-background": "#e5e2e1",
        "outline": "#8e9192",
        "surface-container-highest": "#353534",
        "surface-elevated": "#161616",
        "text-muted": "#888888",
        "on-surface": "#e5e2e1",
        "inverse-on-surface": "#313030",
        "on-primary-fixed-variant": "#454747",
        "surface-container": "#201f1f",
        "surface-variant": "#353534",
        "surface-container-lowest": "#0e0e0e",
        "inverse-primary": "#5d5f5f",
        "secondary-fixed": "#e5e2e1",
        "primary-container": "#e2e2e2",
        "on-tertiary-fixed": "#1a1c1c",
        "background": "#131313",
        "on-secondary-container": "#b7b5b4"
      },
      borderRadius: {
        DEFAULT: "0.25rem",
        lg: "0.5rem",
        xl: "0.75rem",
        full: "9999px"
      },
      spacing: {
        "margin-desktop": "80px",
        "max-width": "1200px",
        gutter: "24px",
        unit: "4px",
        "margin-mobile": "20px"
      },
      fontFamily: {
        "body-lg": ["Inter"],
        "body-md": ["Inter"],
        "display-lg": ["Hanken Grotesk"],
        "headline-lg-mobile": ["Hanken Grotesk"],
        "headline-lg": ["Hanken Grotesk"],
        "label-sm": ["JetBrains Mono"]
      },
      fontSize: {
        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
        "display-lg": ["64px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
        "headline-lg-mobile": ["24px", { lineHeight: "1.2", fontWeight: "600" }],
        "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "600" }],
        "label-sm": ["12px", { lineHeight: "1.0", letterSpacing: "0.05em", fontWeight: "500" }]
      }
    },
  },
}
</script>
<style>
  body { background-color: #0A0A0A; color: #e5e2e1; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  .architectural-grid { background-image: radial-gradient(#262626 1px, transparent 1px); background-size: 24px 24px; }
</style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- TopNavBar -->
  <header class="bg-background border-b border-border-subtle top-0 z-50">
    <div class="flex justify-between items-center h-20 w-full px-margin-mobile md:px-margin-desktop max-w-max-width mx-auto">
      <div class="font-headline-lg text-headline-lg font-bold tracking-tight text-primary">Quick Draw Replica</div>
      <nav class="hidden md:flex items-center gap-gutter">
        <a class="font-body-md text-body-md text-text-muted hover:text-primary transition-colors duration-200" href="https://quickdraw.withgoogle.com/" target="_blank" rel="noopener">About</a>
        <a class="font-body-md text-body-md text-text-muted hover:text-primary transition-colors duration-200" href="https://github.com/sanjaydokula/draw" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center py-12 lg:py-20 px-margin-mobile md:px-margin-desktop architectural-grid">
    <div class="max-w-max-width w-full flex flex-col lg:flex-row items-start justify-center gap-10 lg:gap-12">

      <!-- Left Column: Canvas -->
      <div class="flex flex-col items-center lg:items-start">
        <div class="mb-6 lg:mb-8">
          <span class="font-label-sm text-label-sm text-text-muted uppercase tracking-[0.2em] mb-2 block">Drawing Interface</span>
        </div>
        <div class="relative group">
          <!-- Corner Accents -->
          <div class="absolute -top-2 -left-2 w-4 h-4 border-t border-l border-primary opacity-50"></div>
          <div class="absolute -top-2 -right-2 w-4 h-4 border-t border-r border-primary opacity-50"></div>
          <div class="absolute -bottom-2 -left-2 w-4 h-4 border-b border-l border-primary opacity-50"></div>
          <div class="absolute -bottom-2 -right-2 w-4 h-4 border-b border-r border-primary opacity-50"></div>
          <!-- Canvas -->
          <div class="w-[720px] h-[720px] max-w-full max-h-[70vh] border border-border-subtle transition-all duration-500 group-hover:border-primary overflow-hidden" style="aspect-ratio: 1/1; background: #000;">
            <canvas id="drawingCanvas" width="720" height="720" class="w-full h-full block cursor-crosshair"></canvas>
          </div>
        </div>
      </div>

      <!-- Right Column: Sidebar -->
      <div class="flex flex-col w-full lg:max-w-[340px] pt-0 lg:pt-[76px]">

        <!-- Control Suite -->
        <div class="flex flex-col gap-4 mb-12 lg:mb-16">
          <button id="predictBtn" class="flex items-center justify-center gap-3 bg-white text-surface-dim font-label-sm text-label-sm px-8 py-4 uppercase tracking-widest hover:bg-transparent hover:text-white border border-white transition-all duration-200 active:scale-95 cursor-pointer">
            <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">insights</span>
            Predict
          </button>
          <button id="downloadBtn" class="flex items-center justify-center gap-3 border border-white text-primary font-label-sm text-label-sm px-8 py-4 uppercase tracking-widest hover:bg-white hover:text-surface-dim transition-all duration-200 active:scale-95 cursor-pointer">
            <span class="material-symbols-outlined text-lg">download</span>
            Download
          </button>
          <button id="resetBtn" class="flex items-center justify-center gap-3 border border-border-subtle text-text-muted font-label-sm text-label-sm px-8 py-4 uppercase tracking-widest hover:border-white hover:text-primary transition-all duration-200 active:scale-95 cursor-pointer">
            <span class="material-symbols-outlined text-lg">refresh</span>
            Reset
          </button>
        </div>

        <!-- Meta Data -->
        <div class="space-y-6 lg:space-y-8 border-t border-border-subtle pt-6 lg:pt-8">
          <div>
            <span class="font-label-sm text-[10px] text-text-muted uppercase tracking-[0.2em] mb-2 block [font-variant:small-caps]">Prediction</span>
            <span id="prediction_display" class="font-headline-lg text-headline-lg text-primary block">—</span>
          </div>
          <div>
            <span class="font-label-sm text-[10px] text-text-muted uppercase tracking-[0.2em] mb-2 block [font-variant:small-caps]">System Status</span>
            <span id="modelStatus" class="font-label-sm text-label-sm text-primary flex items-center gap-2">
              <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75" id="statusPing"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500" id="statusDot"></span>
              </span>
              LOADING
            </span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script type="module" src="canvas_utils.js"></script>
</body>
</html>
