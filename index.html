<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Quick Draw</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Hanken+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary-fixed": "#e2e2e2",
        "tertiary-fixed-dim": "#c6c6c7",
        "surface-bright": "#3a3939",
        "on-tertiary": "#2f3131",
        "on-tertiary-fixed-variant": "#454747",
        "surface-tint": "#c6c6c7",
        "tertiary-fixed": "#e2e2e2",
        "on-primary-fixed": "#1a1c1c",
        "on-error": "#690005",
        "surface-dim": "#131313",
        "tertiary": "#ffffff",
        "primary-fixed-dim": "#c6c6c7",
        "on-secondary-fixed": "#1b1c1c",
        "error-container": "#93000a",
        "surface-container-low": "#1c1b1b",
        "border-subtle": "#262626",
        "on-secondary": "#303030",
        "on-surface-variant": "#c4c7c8",
        "outline-variant": "#444748",
        "on-tertiary-container": "#636565",
        "primary": "#ffffff",
        "accent-highlight": "#F4F4F4",
        "on-primary": "#2f3131",
        "on-primary-container": "#636565",
        "on-error-container": "#ffdad6",
        "error": "#ffb4ab",
        "secondary": "#c8c6c5",
        "secondary-container": "#474746",
        "inverse-surface": "#e5e2e1",
        "on-secondary-fixed-variant": "#474746",
        "surface-container-high": "#2a2a2a",
        "secondary-fixed-dim": "#c8c6c5",
        "surface": "#131313",
        "tertiary-container": "#e2e2e2",
        "on-background": "#e5e2e1",
        "outline": "#8e9192",
        "surface-container-highest": "#353534",
        "surface-elevated": "#161616",
        "text-muted": "#888888",
        "on-surface": "#e5e2e1",
        "inverse-on-surface": "#313030",
        "on-primary-fixed-variant": "#454747",
        "surface-container": "#201f1f",
        "surface-variant": "#353534",
        "surface-container-lowest": "#0e0e0e",
        "inverse-primary": "#5d5f5f",
        "secondary-fixed": "#e5e2e1",
        "primary-container": "#e2e2e2",
        "on-tertiary-fixed": "#1a1c1c",
        "background": "#131313",
        "on-secondary-container": "#b7b5b4"
      },
      borderRadius: {
        DEFAULT: "0.25rem",
        lg: "0.5rem",
        xl: "0.75rem",
        full: "9999px"
      },
      fontFamily: {
        "display-lg": ["Hanken Grotesk"],
        "headline-lg": ["Hanken Grotesk"],
        "body-lg": ["Inter"],
        "body-md": ["Inter"],
        "label-sm": ["JetBrains Mono"]
      },
      fontSize: {
        "display-lg": ["64px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
        "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "600" }],
        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
        "label-sm": ["12px", { lineHeight: "1.0", letterSpacing: "0.05em", fontWeight: "500" }]
      }
    }
  }
}
</script>
<style>
  body { background-color: #0A0A0A; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-5">

  <canvas id="drawingCanvas" width="720" height="720" class="border border-border-subtle max-w-full max-h-[70vh] cursor-crosshair block" style="aspect-ratio: 1/1; background: #000;"></canvas>

  <div class="flex flex-wrap justify-center gap-3 mt-10">
    <button id="predictBtn" class="flex items-center gap-2 bg-white text-surface-dim font-label-sm text-label-sm px-8 py-3 uppercase tracking-widest hover:bg-transparent hover:text-white border border-white transition-all duration-200 active:scale-95 cursor-pointer">
      <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">insights</span>
      Predict
    </button>
    <button id="resetBtn" class="flex items-center gap-2 border border-border-subtle text-text-muted font-label-sm text-label-sm px-8 py-3 uppercase tracking-widest hover:border-white hover:text-primary transition-all duration-200 active:scale-95 cursor-pointer">
      <span class="material-symbols-outlined text-lg">refresh</span>
      Reset
    </button>
    <button id="downloadBtn" class="flex items-center gap-2 border border-white text-primary font-label-sm text-label-sm px-8 py-3 uppercase tracking-widest hover:bg-white hover:text-surface-dim transition-all duration-200 active:scale-95 cursor-pointer">
      <span class="material-symbols-outlined text-lg">download</span>
      Download
    </button>
  </div>

  <div class="mt-8 w-full max-w-md border-y border-border-subtle divide-y divide-border-subtle">
    <div class="flex items-center justify-between py-4">
      <span class="font-label-sm text-[10px] text-text-muted uppercase tracking-[0.2em]">Prediction</span>
      <span id="prediction_display" class="font-label-sm text-label-sm text-primary">—</span>
    </div>
    <div class="flex items-center justify-between py-4">
      <span class="font-label-sm text-[10px] text-text-muted uppercase tracking-[0.2em]">Model</span>
      <span id="modelStatus" class="font-label-sm text-label-sm text-primary flex items-center">
        <span class="inline-block w-2 h-2 rounded-full bg-yellow-500 animate-pulse mr-2"></span>LOADING
      </span>
    </div>
  </div>

  <script type="module" src="canvas_utils.js"></script>
</body>
</html>
